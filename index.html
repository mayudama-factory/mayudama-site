<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mayudama Factory</title>
<meta name="description" content="Mayudama Factory（まゆだまファクトリー）は、個人で小さなアプリを作っている工房です。">
<style>
  :root { --ink:#2B2B2B; --quiet:#6B6B6B; --line:#E6E2DA; --bg:#FBFAF7; --accent:#F26B5B; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; color:var(--ink); background:var(--bg); line-height:1.8; }
  main { max-width:680px; margin:0 auto; padding:56px 20px 80px; }
  h1 { font-size:28px; margin:0 0 4px; letter-spacing:.02em; }
  .sub { color:var(--quiet); margin:0 0 40px; }
  h2 { font-size:18px; margin:40px 0 12px; }
  .app { display:flex; gap:16px; align-items:center; padding:16px; border:1px solid var(--line); border-radius:14px; background:#fff; }
  .app img { width:64px; height:64px; border-radius:14px; }
  .app h3 { margin:0; font-size:17px; }
  .app p { margin:2px 0 0; color:var(--quiet); font-size:14px; }
  .app a { color:var(--accent); font-size:14px; }
  footer { margin-top:56px; color:var(--quiet); font-size:13px; border-top:1px solid var(--line); padding-top:16px; }
</style>
</head>
<body>
<main>
  <h1>Mayudama Factory</h1>
  <p class="sub">個人で小さなアプリを作っている工房です。</p>

  <h2>アプリ</h2>
  <div class="app">
    <img src="sukidane/icon.png" alt="スキダネのアイコン">
    <div>
      <h3>スキダネ</h3>
      <p>好きなカテゴリを選ぶだけで、厳選したニュースがまとめて届くRSSリーダー。</p>
      <a href="sukidane/privacy/">プライバシーポリシー</a>
    </div>
  </div>

  <footer>
    お問い合わせ：support@mayudama.app<br>
    &copy; 2026 Mayudama Factory
  </footer>
</main>
</body>
</html>
