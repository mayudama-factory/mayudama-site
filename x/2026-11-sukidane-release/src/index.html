<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スキダネ X 宣伝画像（1600×900）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&amp;display=swap">
<!--
  X 投稿用の宣伝画像 3 枚。文・画面を差し替えるときは、このファイルの文字と screens/ の画像を直して、
  README.md の手順で 01.png〜03.png を書き出し直す。
  見出しは紹介ページ（sukidane/index.html）にある文だけを使う。
  安全範囲：2・3 枚目は中央 70%（x 240〜1360）、1 枚目は X の 3 枚投稿で左が中央 50%（x 400〜1200）に切り抜かれるため、その中に収める。
  ?guides を付けて開くと、その範囲の枠を表示する（確認用。書き出しには使わない）。
-->
<style>
  :root { --bg: #CC4836; --bg-deep: #B63B2B; --bg-light: #D9604E; --white: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #444; font-family: "Zen Kaku Gothic New", sans-serif; display: flex; flex-direction: column; gap: 24px; padding: 24px; width: max-content; }
  .slide { position: relative; width: 1600px; height: 900px; overflow: hidden; background: var(--bg); color: var(--white); }
  /* ごく控えめな飾り（円） */
  .dot { position: absolute; border-radius: 50%; }
  .h { position: absolute; margin: 0; font-weight: 900; line-height: 1.3; letter-spacing: .02em; }
  .sub { position: absolute; margin: 0; font-weight: 700; font-size: 24px; line-height: 1.75; line-break: strict; color: rgba(255,255,255,.92); }
  /* 端末の枠（自前で描いた黒い枠） */
  .dev { position: absolute; width: var(--w); padding: calc(var(--w) * .036); background: #101010; border-radius: calc(var(--w) * .165); box-shadow: 0 26px 54px rgba(60,10,5,.4), inset 0 0 0 calc(var(--w) * .006) #333; transform: rotate(var(--r, 0deg)); }
  .dev img { display: block; width: 100%; height: auto; border-radius: calc(var(--w) * .13); }
  .pills { position: absolute; left: 0; right: 0; top: 316px; display: flex; justify-content: center; gap: 14px; }
  .pill { height: 44px; display: flex; align-items: center; padding: 0 24px; border-radius: 22px; font-weight: 700; font-size: 22px; white-space: nowrap; }
  .pill.on { background: var(--white); color: #A43C30; }
  .pill.off { border: 2px solid rgba(255,255,255,.85); color: var(--white); }
  .brandrow { position: absolute; display: flex; align-items: center; gap: 18px; font-weight: 900; font-size: 44px; }
  .brandrow img { width: 68px; height: 68px; border-radius: 16px; }
  body.guides .slide::after { content: ""; position: absolute; border: 2px dashed #fff; pointer-events: none; }
  body.guides #s1::after { left: 400px; top: 0; width: 800px; height: 900px; }
  body.guides #s2::after, body.guides #s3::after { left: 240px; top: 135px; width: 1120px; height: 630px; }
</style>
</head>
<body>

<!-- 1 枚目：リリースのお知らせ（中央 800px の中に収める） -->
<section class="slide" id="s1">
  <div class="dot" style="width:520px;height:520px;left:-200px;top:420px;background:var(--bg-light);opacity:.55"></div>
  <div class="dot" style="width:380px;height:380px;right:-120px;top:-120px;background:var(--bg-deep);opacity:.6"></div>
  <div class="dot" style="width:90px;height:90px;right:210px;top:560px;background:#E8C468;opacity:.9"></div>
  <div class="brandrow" style="left:50%;top:36px;transform:translateX(-50%);"><img src="icon.png" alt=""><span>スキダネ</span></div>
  <h1 class="h" style="left:0;right:0;top:128px;text-align:center;font-size:68px;">好きなことの更新を、<br>全部ここで。</h1>
  <div class="pills"><div class="pill on">iOS・Android で配信中</div><div class="pill off">Mac・Windows 版も開発中</div></div>
  <div class="dev" style="--w:250px;--r:-7deg;left:490px;top:440px;"><img src="screens/pickup.jpg" alt=""></div>
  <div class="dev" style="--w:250px;--r:7deg;left:860px;top:440px;"><img src="screens/bookmarks.jpg" alt=""></div>
  <div class="dev" style="--w:300px;left:650px;top:412px;"><img src="screens/home.jpg" alt=""></div>
</section>

<!-- 2 枚目：ジャンルを選ぶだけで、そろう（中央 70% の中に収める） -->
<section class="slide" id="s2">
  <div class="dot" style="width:640px;height:640px;left:-260px;top:-240px;background:var(--bg-deep);opacity:.55"></div>
  <div class="dot" style="width:420px;height:420px;right:-140px;bottom:-170px;background:var(--bg-light);opacity:.55"></div>
  <h2 class="h" style="left:240px;top:214px;font-size:76px;">ジャンルを<br>選ぶだけで、<br>そろう</h2>
  <p class="sub" style="left:240px;top:520px;width:560px;">好きなカテゴリを選ぶだけ。<br>おすすめのサイトをまとめてフォローして、<br>すぐに読み始められます。</p>
  <div class="dev" style="--w:280px;--r:-4deg;left:850px;top:156px;"><img src="screens/categories.jpg" alt=""></div>
  <div class="dev" style="--w:280px;--r:4deg;left:1062px;top:156px;"><img src="screens/home.jpg" alt=""></div>
</section>

<!-- 3 枚目：サーバーなし。データは端末の中に（中央 70% の中に収める） -->
<section class="slide" id="s3">
  <div class="dot" style="width:640px;height:640px;right:-260px;top:-240px;background:var(--bg-deep);opacity:.55"></div>
  <div class="dot" style="width:420px;height:420px;left:-150px;bottom:-170px;background:var(--bg-light);opacity:.55"></div>
  <h2 class="h" style="left:240px;top:214px;font-size:72px;">サーバーなし。<br>データは<br>端末の中に</h2>
  <p class="sub" style="left:240px;top:520px;width:560px;">サイトからの記事の取得も、<br>データの保存も、すべて端末の中で行います。</p>
  <div class="dev" style="--w:280px;--r:-4deg;left:850px;top:156px;"><img src="screens/pickup.jpg" alt=""></div>
  <div class="dev" style="--w:280px;--r:4deg;left:1062px;top:156px;"><img src="screens/bookmarks.jpg" alt=""></div>
</section>

</body>
</html>
